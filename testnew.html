<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Pizza">

    <title>Pizza 🍕</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff8f0;
            color: #222;
            text-align: center;
        }

        header {
            padding: 50px 20px 30px;
        }

        .pizza {
            font-size: 90px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 38px;
        }

        p {
            color: #666;
            font-size: 17px;
        }

        .install-btn {
            margin-top: 20px;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            background: #e63946;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .install-btn:hover {
            background: #c92f3b;
        }

        /* iOS popup */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 999;
        }

        .popup {
            width: 100%;
            max-width: 380px;
            background: white;
            border-radius: 18px;
            padding: 25px;
            text-align: left;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        .popup h2 {
            margin-top: 0;
            text-align: center;
        }

        .step {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            margin: 18px 0;
            font-size: 16px;
            line-height: 1.4;
        }

        .number {
            min-width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #e63946;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .close-btn {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #eee;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <header>
        <div class="pizza">🍕</div>

        <h1>Pizza</h1>

        <p>Simple. Hot. Delicious.</p>

        <button id="installBtn" class="install-btn">
            📲 Install App
        </button>
    </header>


    <!-- iOS INSTALL POPUP -->
    <div id="iosPopup" class="overlay">
        <div class="popup">

            <h2>Install Pizza 🍕</h2>

            <div class="step">
                <div class="number">1</div>
                <div>
                    <strong>Click Add to Home Screen</strong>
                </div>
            </div>

            <div class="step">
                <div class="number">2</div>
                <div>
                    <strong>Open as Web App</strong><br>
                    Set it to <strong>ON</strong>
                </div>
            </div>

            <div class="step">
                <div class="number">3</div>
                <div>
                    <strong>Click Add</strong>
                </div>
            </div>

            <button id="closePopup" class="close-btn">
                Close
            </button>

        </div>
    </div>


    <script>
        const installBtn = document.getElementById("installBtn");
        const iosPopup = document.getElementById("iosPopup");
        const closePopup = document.getElementById("closePopup");

        let deferredPrompt = null;


        /*
         * Detect iOS devices
         */
        function isIOS() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                   (navigator.platform === "MacIntel" &&
                    navigator.maxTouchPoints > 1);
        }


        /*
         * Detect if already running as an installed PWA
         */
        function isStandalone() {
            return window.matchMedia("(display-mode: standalone)").matches ||
                   window.navigator.standalone === true;
        }


        /*
         * Hide install button if already installed
         */
        if (isStandalone()) {
            installBtn.style.display = "none";
        }


        /*
         * Android / Desktop:
         * Capture the browser's native PWA install prompt.
         */
        window.addEventListener("beforeinstallprompt", (event) => {
            event.preventDefault();

            deferredPrompt = event;

            installBtn.style.display = "inline-block";
        });


        /*
         * Install button
         */
        installBtn.addEventListener("click", async () => {

            /*
             * iOS ONLY
             *
             * iOS does not provide the normal
             * beforeinstallprompt API, so show
             * custom installation instructions.
             */
            if (isIOS()) {
                iosPopup.style.display = "flex";
                return;
            }


            /*
             * Android / Desktop
             */
            if (deferredPrompt) {

                deferredPrompt.prompt();

                const result = await deferredPrompt.userChoice;

                console.log(
                    "PWA installation:",
                    result.outcome
                );

                deferredPrompt = null;

                return;
            }


            /*
             * If the browser doesn't provide an
             * install prompt.
             */
            alert("Use your browser's Install App option to install Pizza.");
        });


        /*
         * Close iOS popup
         */
        closePopup.addEventListener("click", () => {
            iosPopup.style.display = "none";
        });


        /*
         * Close popup when clicking outside it
         */
        iosPopup.addEventListener("click", (event) => {
            if (event.target === iosPopup) {
                iosPopup.style.display = "none";
            }
        });
    </script>

</body>
</html>
