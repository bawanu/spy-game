<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pizza 🍕</title>

    <!-- PWA -->
    <meta name="theme-color" content="#e63946">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Pizza">

    <link rel="manifest" href="manifest.json">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #fff8f0;
            color: #222;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            padding: 30px;
        }

        .pizza {
            font-size: 90px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-size: 42px;
        }

        p {
            color: #666;
            font-size: 17px;
            margin: 10px 0 25px;
        }

        /* Install button */
        #installBtn {
            padding: 14px 26px;
            border: none;
            border-radius: 12px;

            background: #e63946;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        #installBtn:hover {
            background: #c92f3b;
            transform: translateY(-1px);
        }

        /* iOS popup overlay */
        .overlay {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.55);

            justify-content: center;
            align-items: center;

            padding: 20px;

            z-index: 9999;
        }

        /* Popup */
        .popup {
            width: 100%;
            max-width: 390px;

            background: white;

            border-radius: 20px;

            padding: 25px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);

            animation: popupIn 0.2s ease;
        }

        @keyframes popupIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .popup h2 {
            margin: 0 0 25px;
            text-align: center;
            font-size: 24px;
        }

        .step {
            display: flex;
            align-items: flex-start;

            gap: 14px;

            margin: 20px 0;

            font-size: 16px;
            line-height: 1.45;
        }

        .number {
            flex-shrink: 0;

            width: 32px;
            height: 32px;

            border-radius: 50%;

            background: #e63946;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
        }

        .step strong {
            display: inline-block;
            margin-top: 5px;
        }

        .close-btn {
            width: 100%;

            margin-top: 10px;

            padding: 13px;

            border: none;
            border-radius: 10px;

            background: #eeeeee;

            font-size: 15px;
            cursor: pointer;
        }

        .close-btn:hover {
            background: #dddddd;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="pizza">🍕</div>

        <h1>Pizza</h1>

        <p>Simple. Hot. Delicious.</p>

        <button id="installBtn">
            📲 Install App
        </button>

    </main>


    <!-- iOS INSTALL POPUP -->
    <div id="iosPopup" class="overlay">

        <div class="popup">

            <h2>Install Pizza 🍕</h2>

            <div class="step">
                <div class="number">1</div>

                <div>
                    <strong>
                        Click "Add to Home Screen"
                    </strong>
                </div>
            </div>

            <div class="step">
                <div class="number">2</div>

                <div>
                    <strong>
                        "Open as Web App" → ON
                    </strong>
                </div>
            </div>

            <div class="step">
                <div class="number">3</div>

                <div>
                    <strong>
                        Click "Add"
                    </strong>
                </div>
            </div>

            <button id="closePopup" class="close-btn">
                Close
            </button>

        </div>

    </div>


    <script>

        const installBtn = document.getElementById("installBtn");

        const iosPopup = document.getElementById("iosPopup");

        const closePopup = document.getElementById("closePopup");


        /*
         * Detect iOS
         */
        function isIOS() {

            return (
                /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (
                    navigator.platform === "MacIntel" &&
                    navigator.maxTouchPoints > 1
                )
            );

        }


        /*
         * Detect whether the website is already
         * running as an installed PWA.
         */
        function isStandalone() {

            return (
                window.matchMedia(
                    "(display-mode: standalone)"
                ).matches ||

                window.navigator.standalone === true
            );

        }


        /*
         * Hide the install button when already
         * installed.
         */
        if (isStandalone()) {

            installBtn.style.display = "none";

        }


        /*
         * INSTALL BUTTON
         *
         * 1. Trigger navigator.share()
         *
         * 2. If iOS, show custom PWA instructions.
         *
         * 3. Otherwise, the native share sheet is used.
         */
        installBtn.addEventListener("click", async () => {

            /*
             * Trigger native share sheet
             */
            if (navigator.share) {

                try {

                    await navigator.share({
                        title: "Pizza 🍕",
                        text: "Install Pizza as an app!",
                        url: window.location.href
                    });

                } catch (error) {

                    /*
                     * User closing/cancelling the share
                     * sheet is not an error we need to show.
                     */
                    console.log(
                        "Share cancelled:",
                        error
                    );

                }

            } else {

                console.log(
                    "navigator.share() is not supported."
                );

            }


            /*
             * iOS ONLY
             *
             * Show the custom installation
             * instructions.
             */
            if (isIOS()) {

                iosPopup.style.display = "flex";

            }

        });


        /*
         * Close popup
         */
        closePopup.addEventListener("click", () => {

            iosPopup.style.display = "none";

        });


        /*
         * Close when clicking outside popup
         */
        iosPopup.addEventListener("click", (event) => {

            if (event.target === iosPopup) {

                iosPopup.style.display = "none";

            }

        });


        /*
         * Close popup with ESC on desktop
         */
        document.addEventListener("keydown", (event) => {

            if (event.key === "Escape") {

                iosPopup.style.display = "none";

            }

        });


        /*
         * Register service worker
         */
        if ("serviceWorker" in navigator) {

            window.addEventListener("load", () => {

                navigator.serviceWorker
                    .register("sw.js")
                    .then(() => {
                        console.log(
                            "Service Worker registered."
                        );
                    })
                    .catch((error) => {
                        console.error(
                            "Service Worker registration failed:",
                            error
                        );
                    });

            });

        }

    </script>

</body>
</html>
